spring.application.name=tuneflow-backend

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/tuneflow
spring.datasource.username=postgres
spring.datasource.password=2125

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================

server.port=8081

# ===============================
# JWT
# ===============================

jwt.secret=TuneFlowSuperSecretKeyForDevelopmentOnly2026VeryLongKey
jwt.expiration=86400000